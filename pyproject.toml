[project]
name = "qwen-lab"
version = "0.1.0"
description = "Qwen3 research lab: dissection, data pipeline, fine-tuning and ablations on Apple Silicon"
requires-python = ">=3.12,<3.13"
dependencies = [
  # training / inference on Apple Silicon
  "mlx>=0.26",
  "mlx-lm>=0.25",
  # reference implementation + internals probing
  "torch>=2.7",
  "transformers>=4.53",
  "accelerate>=1.0",
  "peft>=0.15",
  "safetensors",
  "tokenizers",
  "sentencepiece",
  "huggingface-hub[cli]",
  # data
  "datasets>=3.0",
  "datasketch",
  "pandas",
  "numpy",
  "pyyaml",
  # analysis
  "matplotlib",
  "nnsight",
  "tqdm",
  "rich",
  "regex",
  "pytest",
]

[project.optional-dependencies]
extras = ["lm-eval", "wandb", "transformer-lens"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qwen_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "slow: requires loading the full 0.6B checkpoint",
]
